version: '3.8'
services:
  oracle-db:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-db
    expose:
      # Opens port 3306 on the container
      - '1521'
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=password
      - ORACLE_DATABASE=ing
    volumes:
      - oracle-data:/var/lib/oracle/oradata # Path for persistent data
volumes:
  oracle-data: